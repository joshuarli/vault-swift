name: release

on:
  workflow_dispatch:

# Keep write access scoped to the jobs that need it.
permissions: {}

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: macos-26
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Cache .build
        uses: actions/cache@v6
        with:
          path: .build
          key: build-${{ runner.os }}-${{ hashFiles('Package.swift') }}

      - name: Build
        run: swift build -c release

      - uses: actions/upload-artifact@v7
        with:
          name: vault
          path: .build/release/vault

  release:
    name: Create pre-release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: vault
          path: dist

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" dist/vault \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG"
